<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Langtono skruzdėlė</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      padding: 0.5rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    button {
      font: inherit;
      color: var(--bg);
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      padding: 0.35rem 0.9rem;
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: var(--border);
    }

    label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="range"] {
      accent-color: var(--accent);
    }

    #steps {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="toggle">Pradėti</button>
    <button id="reset" class="secondary">Iš naujo</button>
    <label>Greitis <input id="speed" type="range" min="1" max="500" value="100"></label>
    <span id="steps">Žingsniai: 0</span>
  </div>
  <canvas id="board" width="640" height="400"></canvas>
  <script src="ant.js"></script>
</body>
</html>
