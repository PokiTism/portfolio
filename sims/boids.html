<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boidai</title>
  <link rel="stylesheet" href="sim.css">
</head>
<body>
  <div class="controls">
    <button id="toggle" class="icon" title="Pradėti" aria-label="Pradėti"><svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
    <button id="reset" class="icon" title="Iš naujo" aria-label="Iš naujo"><svg class="stroke" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>
  <div class="stage">
    <canvas id="board"></canvas>
    <label class="speed">Greitis <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></label>
  </div>
  <script src="boids.js"></script>
</body>
</html>
